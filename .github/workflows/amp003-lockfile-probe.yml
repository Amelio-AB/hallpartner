name: TEMP AMP-003 pinned lockfile verification (no deploy)

on:
  push:
    branches:
      - feature/hallpartner-v1-skeleton-20261031
    paths:
      - '.github/workflows/amp003-lockfile-probe.yml'

permissions:
  contents: read

jobs:
  generate-verified-lock-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Hallpartner (no persistent credentials)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate genuine SHA-pinned npm dependency and verify clean npm ci
        shell: bash
        env:
          AMP_GITHUB_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AMP_GITHUB_READ_TOKEN" ]; then
            echo "::error::Scoped read-only AMP token not available."
            exit 1
          fi
          # Git uses an ephemeral askpass helper; credentials never enter a URL,
          # package.json, lockfile, npm arguments, commits, or an artifact.
          cat > "$RUNNER_TEMP/amp-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$AMP_GITHUB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/amp-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/amp-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund --save-exact '@amelio/web-platform@git+https://github.com/Amelio-AB/amelio-web-platform.git#a11811bfbf51416e7fe7d58aed4551be77914d65'
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const old = JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const lock = JSON.parse(readFileSync('package-lock.json','utf8'));
          const pkg = JSON.parse(readFileSync('package.json','utf8'));
          const key='node_modules/@amelio/web-platform';
          const expected='a11811bfbf51416e7fe7d58aed4551be77914d65';
          const spec=pkg.dependencies['@amelio/web-platform'];
          if (!spec || !spec.includes(expected)) throw Error('Wrong exact package.json pin');
          if (lock.packages[''].dependencies['@amelio/web-platform'] !== spec) throw Error('Root lock mismatch');
          const entry=lock.packages[key];
          if (entry?.version !== '1.1.0' || !entry.resolved?.endsWith('#'+expected)) throw Error('Package source or version incorrect');
          const changed=Object.keys(lock.packages).filter(x=>JSON.stringify(old.packages[x])!==JSON.stringify(lock.packages[x]));
          const deleted=Object.keys(old.packages).filter(x=>!Object.hasOwn(lock.packages,x));
          if (deleted.length || changed.some(x=>!['',key].includes(x)) || changed.length!==2)
            throw Error('Unexpected npm lockfile churn: '+JSON.stringify({changed,deleted}));
          const content=JSON.stringify({spec,root:lock.packages[''],entry,sha:expected});
          if (content.includes(process.env.AMP_GITHUB_READ_TOKEN)) throw Error('Secret leaked to lockfile');
          console.log('AMP003_LOCK_ENTRY_B64='+Buffer.from(content).toString('base64'));
          console.log('Genuine npm lock delta verified: '+changed.join(', '));
          JS
          # A fresh npm ci proves the generated lockfile resolves from private Git.
          rm -rf node_modules
          npm_config_cache="$RUNNER_TEMP/amp-fresh-npm-cache" npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./node_modules/@amelio/web-platform/package.json');if(p.name!=='@amelio/web-platform'||p.version!=='1.1.0')process.exit(1)"
      - name: Verify the actual AMP-003 renderer, build, and generated output
        env:
          HALLPARTNER_FOOTER_MODE: amp-003
        run: |
          set -euo pipefail
          npm run test:footer
          npm run check
          npm run lint
          npm run build
          node --experimental-strip-types scripts/verify-hallpartner-draft.mjs
