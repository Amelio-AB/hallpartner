name: Hallpartner lead intake audit (no send, no deploy)

on:
  pull_request:
    branches:
      - feature/hallpartner-v1-skeleton-20261031
    paths:
      - '.github/workflows/hallpartner-intake-audit.yml'
      - 'server/lead/**'
      - 'public/api/lead.php'
      - 'tests/lead-receiver.test.php'

permissions:
  contents: read

jobs:
  offline-php:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out review code, no persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: PHP lint and synthetic validator/rate-limit regression tests
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -l server/lead/config.example.php
          php -l server/lead/validator.php
          php -l server/lead/receiver.php
          php -l server/lead/smtp-smoke.php
          php -l public/api/lead.php
          php -l tests/lead-receiver.test.php
          php tests/lead-receiver.test.php
      - name: Test CLI smoke tool fails safely without the explicit send flag
        shell: bash
        run: |
          set -euo pipefail
          if php server/lead/smtp-smoke.php > /dev/null 2>&1; then
            echo "::error::The SMTP smoke tool must not run without --send-test."
            exit 1
          fi
          echo "No SMTP attempt was requested or made by CI."
