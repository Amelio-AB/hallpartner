name: Validate architecture foundation

on:
  push:
    branches:
      - feature/architecture-foundation-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
