name: Preview candidate - validation only
'on':
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: validate
        options: [validate, private-backup, approved-cleanup]
      backup_recipient:
        description: Public RSA recipient only; never a private key or credential
        type: string
        required: false
      verified_backup_sha256:
        description: Inventory digest from the complete privately restored FTPS backup
        type: string
        required: false
  pull_request:
    branches:
      - main
      - integration/hallpartner-main-20261103
  workflow_call:
    secrets:
      AMELIO_PLATFORM_READ_TOKEN:
        required: true
      FTP_HOST:
        required: false
      FTP_USERNAME:
        required: false
      FTP_PASSWORD:
        required: false
    outputs:
      commit:
        value: ${{ jobs.validate.outputs.commit }}
      payload:
        value: ${{ jobs.validate.outputs.payload }}
      evidence:
        value: ${{ jobs.validate.outputs.evidence }}
permissions:
  contents: read
jobs:
  validate:
    if: inputs.operation != 'private-backup' && inputs.operation != 'approved-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      payload: preview-payload-${{ steps.revision.outputs.commit }}-${{ github.run_attempt }}
      evidence: preview-evidence-${{ steps.revision.outputs.commit }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify locked private AMP
        env:
          AMP_GITHUB_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
        run: bash scripts/preview/install-private-amp.sh
      - name: Record exact revision
        id: revision
        run: |-
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p reports/preview
          git rev-parse HEAD > reports/preview/commit.txt
          node --version
          npm --version
      - name: Validate workflow YAML and shell
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          bash scripts/preview/lint-workflows.sh
      - name: Quality and all Node regressions
        run: |-
          npm run check
          npm run lint
          node --test tests/*.test.mjs
      - name: PHP intake syntax and independent receiver validation
        run: |
          php -v
          php -l public/api/lead.php
          php -l server/lead/validator.php
          php -l server/lead/receiver.php
          php -l server/lead/rate-cleanup.php
          php -l server/lead/config.example.php
          php -l server/lead/smtp-smoke.php
          git check-ignore -q server/lead/config.local.php
          if php server/lead/smtp-smoke.php >/dev/null 2>&1; then
            echo "::error::SMTP test must require explicit --send-test"
            exit 1
          fi
          php tests/lead-receiver.test.php
          php -l server/lead/messages.php
          php -l server/lead/delivery.php
      - name: Controlled customer-copy SMTP regression (loopback only)
        run: |
          composer install --working-dir=server/lead --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction
          node scripts/preview/quote-mail-test.mjs
      - name: Audit npm without weakening the existing high gate
        run: npm audit --audit-level=high --json > reports/preview/npm-audit.json
      - name: Audit locked PHP dependencies without SMTP
        run: composer audit --locked --no-dev --working-dir=server/lead --format=json > reports/preview/composer-audit.json
      - name: Pin quote submission flags to reviewed preview release policy
        run: node scripts/preview/quote-release.mjs github-env
      - name: Build exact checkout
        run: npm run build
        env:
          NODE_ENV: production
      - name: Prove PHP receiver fails closed without private config
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:9439 -t dist > "$RUNNER_TEMP/hp-php-server.log" 2>&1 &
          PHP_SERVER=$!
          trap 'kill "$PHP_SERVER" 2>/dev/null || true' EXIT
          ready=0
          for ((attempt=0; attempt<35; attempt++)); do
            if curl -s --max-time 1 -o /dev/null http://127.0.0.1:9439/api/lead.php; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" -eq 1
          code=$(curl -sS --max-time 8 -o "$RUNNER_TEMP/hp-lead-response.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://hallpartner.se' \
            --data '{"contractVersion":1,"technicalId":"quote-flow","configurationId":"hallpartner-contact-v1","answers":{"contact.name":"Synthetic","contact.email":"test@example.invalid","contact.message":"Not a real enquiry."}}' \
            http://127.0.0.1:9439/api/lead.php)
          test "$code" = "503"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(d.status!=='failed')process.exit(1)" "$RUNNER_TEMP/hp-lead-response.json"
      - name: Existing HTML and migration contracts
        run: |-
          node scripts/verify-hallpartner-draft.mjs
          node scripts/verify-url-migration-draft.mjs
      - name: Prepare and verify static-only payload
        env:
          COMMIT: ${{ steps.revision.outputs.commit }}
        run: |-
          node scripts/preview/payload.mjs prepare "$COMMIT"
          node scripts/preview/payload.mjs verify
          node scripts/preview/payload.mjs rights
      - name: Chrome regression on the actual upload payload
        run: node scripts/preview/browser.mjs
      - name: Archive quote browser review before remote FTPS checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-browser-review-${{ steps.revision.outputs.commit }}-${{ github.run_attempt }}
          path: |
            reports/preview/chrome/offert-index-html.log
            reports/preview/chrome/pages/offert-index-html-*
          if-no-files-found: warn
          retention-days: 7
      - name: Install FTPS client for read-only PR target proof
        if: github.event_name == 'pull_request'
        run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Read existing FTPS marker and inventory only - no upload
        if: github.event_name == 'pull_request'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/preview/remote.mjs check-target
      - name: Read-only retained-file preflight in one FTPS session
        if: github.event_name == 'pull_request'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/preview/remote.mjs check-retained
      - name: Save verified payload
        uses: actions/upload-artifact@v4
        with:
          name: preview-payload-${{ steps.revision.outputs.commit }}-${{ github.run_attempt }}
          path: preview-payload/
          if-no-files-found: error
          retention-days: 7
      - name: Chrome regression for future active quote with local mock only
        env:
          NODE_ENV: production
          PUBLIC_HP_QUOTE_SUBMISSIONS_ENABLED: 'true'
          PUBLIC_HP_RECEIVER_VERIFIED: 'true'
          PUBLIC_HP_PRIVACY_APPROVED: 'true'
        run: |-
          # This second build is deliberately NOT part of the verified upload payload.
          # The previously archived preview-payload remains fail-closed.
          npm run build
          node scripts/preview/active-quote-browser.mjs
      - name: Save manifest and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-${{ steps.revision.outputs.commit }}-${{ github.run_attempt }}
          path: reports/preview/
          if-no-files-found: error
          retention-days: 7
  maintenance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'private-backup' || inputs.operation == 'approved-cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: hallpartner-inleed-preview-20261103
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify locked private AMP
        env:
          AMP_GITHUB_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
        run: bash scripts/preview/install-private-amp.sh
      - name: Install verified TLS client
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null
      - name: Prove approved removals are absent from current payload
        if: inputs.operation == 'approved-cleanup'
        env:
          COMMIT: ${{ github.sha }}
        run: |-
          npm run build
          node scripts/preview/payload.mjs prepare "$COMMIT"
          node scripts/preview/payload.mjs verify
          node scripts/preview/payload.mjs rights
      - name: Explicit manual backup or exact approved cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HP_OPERATION: ${{ inputs.operation }}
          HP_BACKUP_RECIPIENT: ${{ inputs.backup_recipient }}
          HP_VERIFIED_BACKUP_SHA256: ${{ inputs.verified_backup_sha256 }}
        run: |-
          case "$HP_OPERATION" in
            private-backup) node scripts/preview/remote.mjs private-backup ;;
            approved-cleanup) node scripts/preview/approved-cleanup.mjs ;;
            *) exit 1 ;;
          esac
      - name: Encrypted one-time transport only - no raw server files
        if: inputs.operation == 'private-backup'
        uses: actions/upload-artifact@v4
        with:
          name: private-preview-backup-${{ github.run_id }}
          path: reports/private-preview-backup.envelope.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve hash-only maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-maintenance-${{ github.run_id }}
          path: reports/preview/
          if-no-files-found: error
          retention-days: 7
