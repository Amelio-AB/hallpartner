# Workflow ID 316932905: development-preview publishing from main only.
# Historical manual-disable comments are obsolete; check real GitHub Actions state.
# PRs validate only; publishing still requires the existing verification gates.
# Development preview only. No production/customer hosting target is configurable.
name: Hallpartner Inleed development preview
'on':
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: hallpartner-inleed-preview-20261103
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/preview-validation.yml
    secrets:
      AMELIO_PLATFORM_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: https://hallpartner-se.preview2.inleed.com/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify locked private AMP
        env:
          AMP_GITHUB_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
        run: bash scripts/preview/install-private-amp.sh
      - name: Download only this run’s verified payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.payload }}
          path: preview-payload
      - name: Download matching manifest
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.evidence }}
          path: reports/preview
      - name: Verify downloaded payload and rights gate
        run: |-
          node scripts/preview/payload.mjs verify
          node scripts/preview/payload.mjs rights
      - name: Install encrypted FTPS client
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null
      - name: Publish to verified development target and verify HTTP content
        env:
          GH_TOKEN: ${{ github.token }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/preview/remote.mjs publish
      - name: Verify actual preview interactions in Chrome after publication
        env:
          HP_SCREENSHOT_DIR: reports/preview/live-browser
        run: |-
          HP_PREVIEW_URL=https://hallpartner-se.preview2.inleed.com/ HP_SCREENSHOT_PREFIX=home node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL=https://hallpartner-se.preview2.inleed.com/stalhallar/ HP_SCREENSHOT_PREFIX=halls node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL=https://hallpartner-se.preview2.inleed.com/offert/ HP_SCREENSHOT_PREFIX=quote node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL=https://hallpartner-se.preview2.inleed.com/stalhallar/ HP_SCREENSHOT_DIR=reports/preview/live-browser/amp006 node scripts/verify-hallpartner-amp006.mjs
          HP_PREVIEW_URL=https://hallpartner-se.preview2.inleed.com/stalhallar/ HP_SCREENSHOT_DIR=reports/preview/live-browser/gallery node scripts/verify-hallpartner-gallery.mjs
      - name: Preserve deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-publication-${{ needs.validate.outputs.commit }}-${{ github.run_attempt }}
          path: reports/preview/
          if-no-files-found: error
          retention-days: 14
