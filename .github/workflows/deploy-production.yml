# Produktionsdeploy för Hallpartner Vision Site.
#
# Körs automatiskt vid varje push till `main`, samt kan köras manuellt via
# "Run workflow" (workflow_dispatch) i GitHub Actions-fliken.
#
# Flöde: npm ci → npm run build → endast innehållet i dist/ FTP-deployas
# till hallpartner.amelio.se via lftp mirror. Inga autentiseringsuppgifter
# finns i denna fil — FTP_HOST/FTP_USERNAME/FTP_PASSWORD hämtas från
# repository-secrets.
#
# Uppladdningsmålet är "./public_html/" — verifierat att detta är
# document root för hallpartner.amelio.se hos Inleed och att kontot
# endast används för denna presentationssajt. Ingen --delete används
# under den inledande testperioden, så inget raderas på servern.
name: Deploy Hallpartner to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallpartner-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate Astro
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify production output
        shell: bash
        run: |
          test -d dist
          test -f dist/index.html
          echo "Build verified: dist/index.html exists."

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: hallpartner-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to hallpartner.amelio.se
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://hallpartner.amelio.se

    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: hallpartner-dist
          path: dist/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp mirror)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:max-retries 2
          set net:timeout 10
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          mirror --reverse --verbose --parallel=4 ./dist/ ./public_html/
          bye
          EOF
