# Full visitor/payload/browser validation now lives in preview-validation.yml.
# Preserve the additional explicit Footer rollback check without rebuilding prototypes.
name: Hallpartner Footer rollback validation (no deployment)
'on':
  pull_request:
    branches: [main, integration/hallpartner-main-20261103]
permissions:
  contents: read
concurrency:
  group: hallpartner-footer-rollback-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  footer-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify the locked private AMP package
        env:
          AMP_GITHUB_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
        run: bash scripts/preview/install-private-amp.sh
      - name: Pin quote flags to the reviewed release policy
        run: node scripts/preview/quote-release.mjs github-env
      - name: Verify explicit Footer rollback on the actual visitor routes
        env:
          HALLPARTNER_FOOTER_MODE: legacy
        run: |
          npm run build
          node scripts/verify-hallpartner-draft.mjs
          node scripts/verify-url-migration-draft.mjs
