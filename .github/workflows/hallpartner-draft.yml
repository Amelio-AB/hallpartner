name: Hallpartner v1 draft validation (no deployment)

on:
  pull_request:
    branches:
      - main
      - feature/amp-integration-readiness-2026-10-31
    paths:
      - '.github/workflows/hallpartner-draft.yml'
      - 'astro.config.mjs'
      - 'src/config/hallpartner-draft-pages.ts'
      - 'src/config/hallpartner-brand.ts'
      - 'src/layouts/HallpartnerDraftLayout.astro'
      - 'src/layouts/HallpartnerSiteLayout.astro'
      - 'src/pages/index.astro'
      - 'src/pages/stalhallar/**'
      - 'src/pages/kontakt/**'
      - 'src/pages/om-oss/**'
      - 'src/pages/sa-gar-det-till/**'
      - 'src/styles/hallpartner-info.css'
      - 'src/styles/hallpartner-stalhallar.css'
      - 'src/styles/hallpartner-hall-detail.css'
      - 'src/styles/hallpartner-hall-variants.css'
      - 'src/styles/hallpartner-draft.css'
      - 'src/pages/prototype/hallpartner/**'
      - 'src/components/prototype/**'
      - 'src/styles/hallpartner-home.css'
      - 'scripts/capture-hallpartner-home.mjs'
      - 'tests/hallpartner-draft.test.mjs'
      - 'tests/amp-brand.test.mjs'
      - 'scripts/verify-hallpartner-draft.mjs'
      - 'package.json'
      - 'src/config/hallpartner-footer.mjs'
      - 'src/styles/hallpartner-amp-footer.css'
      - 'scripts/prepare-amp-footer.mjs'
      - 'tests/hallpartner-amp-footer.test.mjs'
      - 'package-lock.json'
      - 'src/config/hallpartner-amp-header.ts'
      - 'src/components/prototype/HallpartnerAmpHeaderReview.astro'
      - 'src/pages/prototype/amp/header/**'
      - 'src/styles/hallpartner-amp-header-review.css'
      - 'tests/hallpartner-amp-header.test.mjs'
      - 'scripts/capture-hallpartner-amp-header.mjs'

permissions:
  contents: read

concurrency:
  group: hallpartner-v1-draft-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  draft-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Record revision
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install SHA-locked private AMP dependencies using read-only auth
        shell: bash
        env:
          AMP_GITHUB_READ_TOKEN: ${{ secrets.AMELIO_PLATFORM_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AMP_GITHUB_READ_TOKEN" ]; then
            echo "::error::AMP-003 requires AMELIO_PLATFORM_READ_TOKEN to read the private source; build intentionally blocked."
            exit 1
          fi
          # The credential is used only during install; never stored in Git URLs,
          # npm lockfile, scripts, or build/test environment.
          cat > "$RUNNER_TEMP/amp-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$AMP_GITHUB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/amp-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/amp-askpass.sh" GIT_TERMINAL_PROMPT=0 npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate approved AMP-003 package source after install
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest=JSON.parse(readFileSync('node_modules/@amelio/web-platform/package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const sha='a11811bfbf51416e7fe7d58aed4551be77914d65';
          if(manifest.name!=='@amelio/web-platform'||manifest.version!=='1.1.0'
             ||lock.packages['node_modules/@amelio/web-platform']?.version!=='1.1.0'
             ||!lock.packages['node_modules/@amelio/web-platform']?.resolved?.endsWith('#'+sha))
            throw Error('AMP-003 private release pin is incorrect');
          console.log('Approved AMP-003 v1.1.0 locked source verified.');
          JS
      - name: Astro and TypeScript
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Contract tests (AMP-003 default, legacy rollback available)
        run: node --experimental-strip-types --test tests/amp-brand.test.mjs tests/hallpartner-draft.test.mjs tests/hallpartner-amp-footer.test.mjs tests/hallpartner-amp-header.test.mjs
      - name: Build static Astro site (no upload)
        run: npm run build
        env:
          NODE_ENV: production
      - name: Verify noindex, landmarks and sitemap exclusions in dist
        run: node --experimental-strip-types scripts/verify-hallpartner-draft.mjs
      - name: Verify full-page visuals, images and mobile menu with Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-review
          ./node_modules/.bin/astro preview --host 127.0.0.1 --port 4321 > visual-review/cdp-preview-server.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          URL="http://127.0.0.1:4321/prototype/hallpartner/start/"
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL" >/dev/null; then READY=1; break; fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo "CDP visual preview failed to start" > visual-review/validated-ERROR.txt
            exit 1
          fi
          timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/" HP_SCREENSHOT_PREFIX="site-home" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/prototype/hallpartner/hallar/" HP_SCREENSHOT_PREFIX="hallar" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/" HP_SCREENSHOT_PREFIX="site-stalhallar" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/lagerhall/" HP_SCREENSHOT_PREFIX="site-lagerhall" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/maskinhall/" HP_SCREENSHOT_PREFIX="site-maskinhall" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/plathall/" HP_SCREENSHOT_PREFIX="site-plathall" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/isolerad-hall/" HP_SCREENSHOT_PREFIX="site-isolerad-hall" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/ridhus/" HP_SCREENSHOT_PREFIX="site-ridhus" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/stalhallar/talthall/" HP_SCREENSHOT_PREFIX="site-talthall" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/kontakt/" HP_SCREENSHOT_PREFIX="site-kontakt" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/sa-gar-det-till/" HP_SCREENSHOT_PREFIX="site-process" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/om-oss/" HP_SCREENSHOT_PREFIX="site-om-oss" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/prototype/hallpartner/lagerhallar/" HP_SCREENSHOT_PREFIX="lagerhallar" timeout 90s node scripts/capture-hallpartner-home.mjs
          HP_PREVIEW_URL="http://127.0.0.1:4321/prototype/hallpartner/maskinhallar/" HP_SCREENSHOT_PREFIX="maskinhallar" timeout 90s node scripts/capture-hallpartner-home.mjs
          timeout 180s node scripts/capture-hallpartner-amp-header.mjs

      - name: Preserve validated visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hallpartner-home-visual-${{ github.event.pull_request.head.sha }}
          path: visual-review/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve static build for later review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hallpartner-v1-draft-${{ github.event.pull_request.head.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Verify explicit legacy Footer rollback (no artifact replacement)
        env:
          HALLPARTNER_FOOTER_MODE: legacy
        run: |
          npm run build
          node --experimental-strip-types scripts/verify-hallpartner-draft.mjs
