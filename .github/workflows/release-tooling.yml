name: Release tooling - no publication
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  byte-exact-archive:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Startup failures and exact Git bytes on Linux and Windows
        run: node --test tests/chrome-session.test.mjs tests/php-candidate.test.mjs
      - name: Archive and verify exact PR revision
        env:
          COMMIT: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: node scripts/preview/php-candidate.mjs build "$COMMIT" reports/php-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: php-candidate-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: reports/php-candidate/
          retention-days: 7
          if-no-files-found: error
